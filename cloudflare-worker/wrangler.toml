name = "adrien-cv-assistant"
main = "src/index.js"
compatibility_date = "2026-03-23"
workers_dev = true
preview_urls = false

[observability.logs]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://teas0710.github.io"
OLLAMA_BASE_URL = "https://ollama.com"
# Larger Gemma model = far more natural conversation than gemma3:4b.
# One-line swap if you want another Ollama Cloud model later.
OLLAMA_MODEL = "gemma3:27b"
